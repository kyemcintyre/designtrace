# Lint and test every push and pull request; on main, release with semantic-release.
#
# Releases: the commit messages since the last tag (Conventional Commits) decide the next version
# (fix: patch, feat: minor, BREAKING CHANGE: major). semantic-release writes it into the module
# descriptor and ChangeLog.md, commits that back to main, tags vX.Y.Z and publishes a GitHub
# release with module_designtrace-X.Y.Z.zip, ready for Dolibarr's "Deploy external module".
name: CI and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint
        run: |
          status=0
          while IFS= read -r -d '' f; do
            out=$(php -l "$f" 2>&1) || { echo "$out"; status=1; }
          done < <(find designtrace .github -name '*.php' -print0)
          exit $status

  test:
    name: PHPUnit on Dolibarr 24.0.2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Install PHPUnit
        run: composer install --no-interaction --no-progress

      - name: Start Dolibarr and MariaDB
        run: docker compose -f .github/ci/docker-compose.yml up -d

      - name: Wait for Dolibarr's automatic install
        run: |
          for i in $(seq 1 90); do
            if docker compose -f .github/ci/docker-compose.yml exec -T dolibarr test -f /var/www/documents/install.lock \
              && curl -fsS -o /dev/null http://localhost:8080/index.php; then
              echo "Dolibarr is up"; exit 0
            fi
            sleep 5
          done
          echo "Dolibarr did not come up"; exit 1

      - name: Enable the core modules, then DesignTrace
        run: |
          dc="docker compose -f .github/ci/docker-compose.yml exec -T -u www-data dolibarr"
          $dc php /var/www/html/custom/.github/ci/setup-dolibarr.php core
          $dc php /var/www/html/custom/.github/ci/setup-dolibarr.php designtrace

      - name: Run the tests
        run: |
          docker compose -f .github/ci/docker-compose.yml exec -T -u www-data dolibarr \
            php /var/www/html/custom/designtrace/test/phpunit/run-tests.php --do-not-cache-result

      - name: Dolibarr logs
        if: failure()
        run: docker compose -f .github/ci/docker-compose.yml logs --tail=200

      - name: Stop
        if: always()
        run: docker compose -f .github/ci/docker-compose.yml down -v

  package:
    name: Package (no release)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: php .github/scripts/package.php dist
      - uses: actions/upload-artifact@v4
        with:
          name: module_designtrace
          path: dist/*.zip
          retention-days: 14

  release:
    name: Release
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - run: npm ci --no-audit --no-fund

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
